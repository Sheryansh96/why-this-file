[project]
name = "rationale-map"
version = "0.2.0"
description = "Visualize which files a coding agent touched, and why, from its own session transcript."
requires-python = ">=3.10"

[project.scripts]
why-this-file = "rationale_map.cli:main"
rationale-map = "rationale_map.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rationale_map", "rationale_map.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
